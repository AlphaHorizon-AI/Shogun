name: Release evidence

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Generate release identity and direct-dependency SPDX SBOM
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          python scripts/generate_release_evidence.py
          --output-dir release-evidence
          --release-tag "${RELEASE_TAG}"
          --require-git-sha
      - name: Upload auditable workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shogun-release-evidence-${{ github.sha }}
          path: release-evidence/
          if-no-files-found: error
          retention-days: 90
  attach-to-release:
    if: github.event_name == 'release'
    needs: release-evidence
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download generated evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: shogun-release-evidence-${{ github.sha }}
          path: release-evidence
      - name: Attach evidence to the published GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "${RELEASE_TAG}" release-evidence/* --clobber
