[project]
name = "shogun-agentflow"
version = "1.0.0"
description = "Bare-bones Shogun AgentFlow — visual AI workflow runner with ad-hoc agents, AI providers, routing profiles, and local folder setup"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Alpha Horizon" }]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "aiosqlite>=0.20.0",
    "greenlet>=3.1.0",
    "cryptography>=43.0.0",
    "python-dotenv>=1.0.0",
    "apscheduler>=3.10.0",
    "httpx>=0.27.0",
    "certifi>=2026.10.19",
    "python-multipart>=0.0.12",
    "pypdf>=4.0.0",
    "openpyxl>=3.1.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    "lxml>=5.0.0",
    "pyyaml>=6.0.0",
    "regex>=2024.0.0",
]

[project.optional-dependencies]
office = [
    "openpyxl>=3.1.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]

[project.scripts]
shogun = "shogun.__main__:main"

[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["shogun*"]

[tool.setuptools.package-data]
shogun = [
    "resources/*.json",
    "resources/transformation_profiles/*.json",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
